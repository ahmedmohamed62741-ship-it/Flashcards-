<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo Hybrid PDF Engine</title>
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; min-height: 100vh; padding: 20px 0; }
        .main-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 30px; }
        .drop-zone { border: 2px dashed #38bdf8; border-radius: 16px; background: rgba(56, 189, 248, 0.03); padding: 35px 20px; cursor: pointer; }
        .form-control { background-color: #0f172a; border-color: #334155; color: #e2e8f0; }
        .log-box { background: #090d16; border-radius: 10px; font-family: monospace; font-size: 0.85rem; max-height: 150px; overflow-y: auto; padding: 10px; color: #38bdf8; text-align: left; dir: ltr; }
    </style>
</head>
<body>

<div class="container" style="max-width: 680px;">
    <div class="main-card text-center">
        <h3 class="fw-bold mb-2" style="color: #38bdf8;">⚡ Termo Dual PDF Generator</h3>
        <p class="text-slate-400 small mb-4">دمج صورة المحاضرة مع نصها المكتوب لضمان النسخ على جميع أجهزة الموبايل</p>

        <div class="mb-3 text-start">
            <label class="form-label text-slate-300 small fw-bold">Gemini API Key:</label>
            <input type="password" id="apiKeyInput" class="form-control form-control-sm" placeholder="AIzaSy..." onchange="saveApiKey()">
        </div>

        <div class="drop-zone mb-3" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 2rem;">📄</div>
            <h6 class="fw-bold text-white mb-1">رفع ملف المحاضرة أو الصور</h6>
            <input type="file" id="fileInput" accept="image/*,application/pdf" multiple style="display:none;" onchange="handleFileSelect(this.files)">
        </div>

        <div id="progressSection" style="display:none;" class="mb-3">
            <div class="d-flex justify-content-between small text-slate-300 mb-1">
                <span id="progressText">جاري المعالجة...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress" style="height: 8px;">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 0%"></div>
            </div>
        </div>

        <div id="logBox" class="log-box mb-3" style="display:none;"></div>

        <button id="downloadBtn" style="display:none;" class="btn btn-success w-100 py-2 fw-bold" onclick="triggerDownload()">
            📥 تحميل ملف الـ PDF الشامل (شغال 100% للنسخ)
        </button>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let generatedPdfBytes = null;

    window.onload = () => {
        const savedKey = localStorage.getItem('termo_gemini_key');
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    };

    function saveApiKey() {
        localStorage.setItem('termo_gemini_key', document.getElementById('apiKeyInput').value.trim());
    }

    function logMessage(msg) {
        const logBox = document.getElementById('logBox');
        logBox.style.display = 'block';
        logBox.innerHTML += `> ${msg}<br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function handleFileSelect(files) {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        if (!apiKey) return alert("أدخل مفتاح Gemini API أولاً!");
        if (!files || files.length === 0) return;

        document.getElementById('progressSection').style.display = 'block';
        document.getElementById('downloadBtn').style.display = 'none';
        document.getElementById('logBox').innerHTML = '';

        try {
            const pdfDoc = await PDFLib.PDFDocument.create();
            const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);

            let pageQueue = [];
            for (let file of files) {
                if (file.type === "application/pdf") {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    for (let i = 1; i <= pdf.numPages; i++) pageQueue.push({ type: 'pdf_page', pdf, pageNum: i });
                } else if (file.type.startsWith("image/")) {
                    pageQueue.push({ type: 'image_file', file });
                }
            }

            const totalPages = pageQueue.length;
            logMessage(`عدد الصفحات: ${totalPages}`);

            for (let index = 0; index < totalPages; index++) {
                updateProgress(`معالجة الصفحة (${index + 1} من ${totalPages})...`, Math.round(((index) / totalPages) * 100));

                const item = pageQueue[index];
                let canvas;

                if (item.type === 'pdf_page') {
                    const page = await item.pdf.getPage(item.pageNum);
                    const viewport = page.getViewport({ scale: 1.5 });
                    canvas = document.createElement('canvas');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                } else {
                    canvas = await imageToCanvas(item.file);
                }

                const imgDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                const base64Data = imgDataUrl.split(',')[1];

                logMessage(`استخراج النص العربي والإنجليزي للصفحة ${index + 1}...`);
                const extractedText = await callGeminiExtract(apiKey, base64Data);

                const jpgImage = await pdfDoc.embedJpg(imgDataUrl);
                
                // إنشاء صفحة بحجم مناسب يتسع للصورة والنص أسفلها
                const pageHeight = jpgImage.height + 400;
                const pdfPage = pdfDoc.addPage([jpgImage.width, pageHeight]);

                // رسم صورة المحاضرة في الأعلى
                pdfPage.drawImage(jpgImage, {
                    x: 0,
                    y: pageHeight - jpgImage.height,
                    width: jpgImage.width,
                    height: jpgImage.height
                });

                // رسم خلفية النص في الأسفل
                pdfPage.drawRectangle({
                    x: 0,
                    y: 0,
                    width: jpgImage.width,
                    height: pageHeight - jpgImage.height,
                    color: PDFLib.rgb(0.95, 0.96, 0.98)
                });

                // كتابة النص المكتوب بتنسيق واضح وقابل للنسخ 100%
                const cleanText = extractedText.replace(/[^\x00-\x7F\u0600-\u06FF\s]/g, "");
                const lines = cleanText.split('\n');
                let startY = pageHeight - jpgImage.height - 30;

                lines.forEach(line => {
                    if (startY > 20 && line.trim() !== '') {
                        try {
                            pdfPage.drawText(line.trim(), {
                                x: 20,
                                y: startY,
                                size: 12,
                                font: font,
                                color: PDFLib.rgb(0.1, 0.1, 0.2)
                            });
                            startY -= 18;
                        } catch (e) {}
                    }
                });
            }

            updateProgress("تم تحويل المحاضرة بنجاح!", 100);
            generatedPdfBytes = await pdfDoc.save();
            document.getElementById('downloadBtn').style.display = 'block';

        } catch (err) {
            logMessage(`❌ خطأ: ${err.message}`);
        }
    }

    async function callGeminiExtract(apiKey, base64Image) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const promptText = `Extract all text lines (Arabic & English) from this image cleanly in natural reading order. Return plain text only.`;

        const requestBody = {
            contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }]
        };

        try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody) });
            const data = await res.json();
            return data.candidates[0].content.parts[0].text;
        } catch (e) {
            return "تعذر استخراج النص.";
        }
    }

    function imageToCanvas(file) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width; canvas.height = img.height;
                canvas.getContext('2d').drawImage(img, 0, 0);
                resolve(canvas);
            };
            img.src = URL.createObjectURL(file);
        });
    }

    function updateProgress(text, percent) {
        document.getElementById('progressText').innerText = text;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('progressBar').style.width = `${percent}%`;
    }

    function triggerDownload() {
        const blob = new Blob([generatedPdfBytes], { type: "application/pdf" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Termo_Lecture_Selectable_${Date.now()}.pdf`;
        link.click();
    }
</script>
</body>
</html>
