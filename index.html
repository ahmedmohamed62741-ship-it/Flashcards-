<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo PDF Engine | محول المستندات الذكي</title>
    
    <!-- PDF-Lib, Fontkit & PDF.js Libraries -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; padding: 20px 0; }
        .main-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); padding: 35px; }
        .drop-zone { border: 2px dashed #38bdf8; border-radius: 16px; background: rgba(56, 189, 248, 0.03); padding: 40px 20px; cursor: pointer; transition: 0.3s; }
        .drop-zone:hover { background: rgba(56, 189, 248, 0.08); border-color: #7dd3fc; }
        .form-control, .form-control:focus { background-color: #0f172a; border-color: #334155; color: #e2e8f0; }
        .progress-bar { background: linear-gradient(90deg, #38bdf8, #818cf8); }
        .log-box { background: #090d16; border-radius: 10px; font-family: monospace; font-size: 0.85rem; max-height: 150px; overflow-y: auto; padding: 10px; color: #38bdf8; text-align: left; dir: ltr; }
    </style>
</head>
<body>

<div class="container" style="max-width: 680px;">
    <div class="main-card text-center">
        <h2 class="fw-bold mb-2" style="color: #38bdf8;">⚡ Termo PDF Engine (عربي / إنجليزي)</h2>
        <p class="text-slate-400 mb-4">تحويل الصور والبحوث إلى ملفات **مطابقة 100%** وقابلة لنسخ وتحديد النص</p>

        <!-- API Key Box -->
        <div class="mb-4 text-start">
            <label class="form-label text-slate-300 small fw-bold">مفتاح Gemini API Key:</label>
            <input type="password" id="apiKeyInput" class="form-control form-control-sm" placeholder="AIzaSy..." onchange="saveApiKey()">
        </div>

        <!-- Upload Drop Zone -->
        <div class="drop-zone mb-4" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 2.5rem;" class="mb-2">📄</div>
            <h5 class="fw-bold text-white mb-1">اضغط هنا لرفع الملفات</h5>
            <p class="text-slate-400 small mb-0">يدعم صور (JPG/PNG) أو ملفات PDF كبيرة متعددة الصفحات</p>
            <input type="file" id="fileInput" accept="image/*,application/pdf" multiple style="display:none;" onchange="handleFileSelect(this.files)">
        </div>

        <!-- Progress Indicator -->
        <div id="progressSection" style="display:none;" class="mb-4">
            <div class="d-flex justify-content-between small text-slate-300 mb-1">
                <span id="progressText">جاري المعالجة...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress" style="height: 10px;">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
            </div>
        </div>

        <!-- Live Status Logs -->
        <div id="logBox" class="log-box mb-4" style="display:none;"></div>

        <!-- Download Button -->
        <button id="downloadBtn" style="display:none;" class="btn btn-success w-100 py-2 fw-bold" onclick="triggerDownload()">
            📥 تحميل ملف الـ PDF القابل للنسخ الآن
        </button>
    </div>
</div>

<script>
    // Initialize PDF.js Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let generatedPdfBytes = null;
    let cachedFontBytes = null;

    // Load Arabic Unicode Font into memory
    async function loadArabicFont() {
        if (cachedFontBytes) return cachedFontBytes;
        logMessage("جاري تحميل خط اللغة العربية والإنجليزية (Amiri Font)...");
        const fontUrl = 'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/amiri/Amiri-Regular.ttf';
        const response = await fetch(fontUrl);
        cachedFontBytes = await response.arrayBuffer();
        logMessage("تم تحميل الخط المخصص بنجاح!");
        return cachedFontBytes;
    }

    window.onload = () => {
        const savedKey = localStorage.getItem('termo_gemini_key');
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    };

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('termo_gemini_key', key);
    }

    function logMessage(msg) {
        const logBox = document.getElementById('logBox');
        logBox.style.display = 'block';
        logBox.innerHTML += `> ${msg}<br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function handleFileSelect(files) {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        if (!apiKey) {
            alert("يرجى إدخال مفتاح Gemini API أولاً!");
            return;
        }

        if (!files || files.length === 0) return;

        document.getElementById('progressSection').style.display = 'block';
        document.getElementById('downloadBtn').style.display = 'none';
        document.getElementById('logBox').innerHTML = '';

        try {
            // Register Fontkit and embed Unicode font for Full Arabic/English support
            const fontBytes = await loadArabicFont();
            const pdfDoc = await PDFLib.PDFDocument.create();
            pdfDoc.registerFontkit(fontkit);
            const customFont = await pdfDoc.embedFont(fontBytes, { subset: false });

            let pageQueue = [];
            logMessage("جاري إعداد وتحليل الملفات...");

            for (let file of files) {
                if (file.type === "application/pdf") {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        pageQueue.push({ type: 'pdf_page', pdf, pageNum: i });
                    }
                } else if (file.type.startsWith("image/")) {
                    pageQueue.push({ type: 'image_file', file });
                }
            }

            const totalPages = pageQueue.length;
            logMessage(`إجمالي الصفحات المكتشفة: ${totalPages}`);

            for (let index = 0; index < totalPages; index++) {
                const percent = Math.round(((index) / totalPages) * 100);
                updateProgress(`معالجة الصفحة (${index + 1} من ${totalPages})...`, percent);

                const item = pageQueue[index];
                let canvas;

                if (item.type === 'pdf_page') {
                    const page = await item.pdf.getPage(item.pageNum);
                    const viewport = page.getViewport({ scale: 1.5 });
                    canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: ctx, viewport }).promise;
                } else {
                    canvas = await imageToCanvas(item.file);
                }

                const imgDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                const base64Data = imgDataUrl.split(',')[1];

                logMessage(`جاري استخراج النصوص (عربي/إنجليزي) للصفحة ${index + 1}...`);
                const ocrResults = await callGeminiOCRWithRetry(apiKey, base64Data);

                const jpgImage = await pdfDoc.embedJpg(imgDataUrl);
                const pdfPage = pdfDoc.addPage([jpgImage.width, jpgImage.height]);
                pdfPage.drawImage(jpgImage, { x: 0, y: 0, width: jpgImage.width, height: jpgImage.height });

                // Draw Invisible Unicode Text Layer
                if (ocrResults && ocrResults.length > 0) {
                    ocrResults.forEach(item => {
                        if (!item.box_2d || !item.text) return;

                        const textStr = item.text.trim();
                        if (!textStr) return;

                        const [ymin, xmin, ymax, xmax] = item.box_2d;
                        const boxWidth = ((xmax - xmin) / 1000) * jpgImage.width;
                        const boxHeight = ((ymax - ymin) / 1000) * jpgImage.height;
                        
                        const posX = (xmin / 1000) * jpgImage.width;
                        const posY = jpgImage.height - ((ymax / 1000) * jpgImage.height) + (boxHeight * 0.15);
                        const fontSize = Math.max(8, boxHeight * 0.75);

                        try {
                            pdfPage.drawText(textStr, {
                                x: posX,
                                y: posY,
                                size: fontSize,
                                font: customFont,
                                opacity: 0.001 // Invisible text overlay for selection
                            });
                        } catch (e) {
                            console.warn("إخفاق مؤقت لسلسلة نصية:", e);
                        }
                    });
                }
            }

            updateProgress("تم تحويل جميع الصفحات واكتشاف النصوص بنجاح!", 100);
            generatedPdfBytes = await pdfDoc.save();
            document.getElementById('downloadBtn').style.display = 'block';
            logMessage("الملف النهائي جاهز ومكتمل للتنزيل!");

        } catch (err) {
            console.error(err);
            logMessage(`❌ خطأ: ${err.message}`);
            alert("حدث خطأ أثناء معالجة الملف، يُرجى التأكد من مفتاح API ومحاولة رفع الملف مجدداً.");
        }
    }

    async function callGeminiOCRWithRetry(apiKey, base64Image, retries = 2) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        
        const promptText = `Extract all text lines (Arabic or English) from this image with 2D bounding boxes normalized to 0-1000 scale.
Return strictly a valid JSON array of objects with keys "box_2d" ([ymin, xmin, ymax, xmax]) and "text". Do not wrap in markdown or codeblocks. Example:
[{"box_2d": [100, 200, 150, 800], "text": "نص عربي أو إنجليزي"}]`;

        const requestBody = {
            contents: [{
                parts: [
                    { text: promptText },
                    { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                ]
            }],
            generationConfig: { response_mime_type: "application/json" }
        };

        for (let attempt = 0; attempt <= retries; attempt++) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) throw new Error(`API Error Code: ${response.status}`);
                
                const data = await response.json();
                let jsonText = data.candidates[0].content.parts[0].text;
                return JSON.parse(jsonText);
            } catch (e) {
                if (attempt === retries) return [];
                await new Promise(r => setTimeout(r, 1500));
            }
        }
    }

    function imageToCanvas(file) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                resolve(canvas);
            };
            img.src = URL.createObjectURL(file);
        });
    }

    function updateProgress(text, percent) {
        document.getElementById('progressText').innerText = text;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('progressBar').style.width = `${percent}%`;
    }

    function triggerDownload() {
        if (!generatedPdfBytes) return;
        const blob = new Blob([generatedPdfBytes], { type: "application/pdf" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Termo_Searchable_Doc_${Date.now()}.pdf`;
        link.click();
    }
</script>

</body>
</html>
