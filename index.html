<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo AI Slide Builder Pro</title>
    
    <!-- PDF.js & PptxGenJS Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; padding: 25px 0; }
        .main-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); padding: 35px; }
        .drop-zone { border: 2px dashed #38bdf8; border-radius: 16px; background: rgba(56, 189, 248, 0.03); padding: 30px; cursor: pointer; transition: 0.3s; }
        .drop-zone:hover { background: rgba(56, 189, 248, 0.08); }
        .form-control, .form-select { background-color: #0f172a; border-color: #334155; color: #f8fafc; }
        .form-control:focus { background-color: #0f172a; color: #fff; border-color: #38bdf8; box-shadow: none; }
        .log-box { background: #090d16; border-radius: 10px; font-family: monospace; font-size: 0.85rem; max-height: 150px; overflow-y: auto; padding: 12px; color: #38bdf8; text-align: left; dir: ltr; }
    </style>
</head>
<body>

<div class="container" style="max-width: 720px;">
    <div class="main-card text-center">
        <h2 class="fw-bold mb-2" style="color: #38bdf8;">📊 Termo AI Presentation Generator</h2>
        <p class="text-slate-400 small mb-4">صانع السلايدات الذكي | تحويل الصور والملفات والنصوص لملف PowerPoint إبداعي</p>

        <!-- API Key Box -->
        <div class="mb-3 text-start">
            <label class="form-label text-slate-300 small fw-bold">Gemini API Key:</label>
            <input type="password" id="apiKeyInput" class="form-control form-control-sm" placeholder="AIzaSy..." onchange="saveApiKey()">
        </div>

        <!-- Input Type Switcher -->
        <div class="btn-group w-100 mb-3" role="group">
            <input type="radio" class="btn-check" name="inputType" id="typeFile" checked onclick="toggleInputMode('file')">
            <label class="btn btn-outline-info" for="typeFile">📄 رفع صور / ملفات PDF</label>

            <input type="radio" class="btn-check" name="inputType" id="typeText" onclick="toggleInputMode('text')">
            <label class="btn btn-outline-info" for="typeText">✍️ كتابة / نسخ نص مباشر</label>
        </div>

        <!-- File Upload Zone -->
        <div id="fileUploadContainer" class="drop-zone mb-3" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 2.2rem;" class="mb-1">📸</div>
            <h6 class="fw-bold text-white mb-1">ارفع صور المحاضرة أو ملف الـ PDF</h6>
            <p class="text-slate-400 small mb-0">سيتم قراءة النص وتصميمه في سلايدات تلقائياً</p>
            <input type="file" id="fileInput" accept="image/*,application/pdf" multiple style="display:none;">
        </div>

        <!-- Text Area Box -->
        <div id="textInputContainer" class="mb-3 text-start" style="display:none;">
            <label class="form-label text-slate-300 small fw-bold">نص المحاضرة:</label>
            <textarea id="rawTextInput" class="form-control" rows="6" placeholder="انسخ نص المحاضرة هنا..."></textarea>
        </div>

        <!-- Process Button -->
        <button id="processBtn" class="btn btn-primary w-100 py-2 fw-bold mb-3" style="background: linear-gradient(90deg, #0ea5e9, #6366f1); border:none;" onclick="startBuildingPresentation()">
            🚀 إنتاج عرض PowerPoint الجذاب الآن
        </button>

        <!-- Progress Indicator -->
        <div id="progressSection" style="display:none;" class="mb-3">
            <div class="d-flex justify-content-between small text-slate-300 mb-1">
                <span id="progressText">جاري المعالجة...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress" style="height: 8px;">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 0%"></div>
            </div>
        </div>

        <!-- Live Status Logs -->
        <div id="logBox" class="log-box mb-3" style="display:none;"></div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    window.onload = () => {
        const savedKey = localStorage.getItem('termo_gemini_key');
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    };

    function saveApiKey() {
        localStorage.setItem('termo_gemini_key', document.getElementById('apiKeyInput').value.trim());
    }

    function toggleInputMode(mode) {
        document.getElementById('fileUploadContainer').style.display = mode === 'file' ? 'block' : 'none';
        document.getElementById('textInputContainer').style.display = mode === 'text' ? 'block' : 'none';
    }

    function logMessage(msg) {
        const logBox = document.getElementById('logBox');
        logBox.style.display = 'block';
        logBox.innerHTML += `> ${msg}<br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function startBuildingPresentation() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        if (!apiKey) return alert("يرجى إدخال مفتاح Gemini API أولاً!");

        const isTextMode = document.getElementById('typeText').checked;
        let lectureContent = "";

        document.getElementById('progressSection').style.display = 'block';
        document.getElementById('logBox').innerHTML = '';

        try {
            if (isTextMode) {
                lectureContent = document.getElementById('rawTextInput').value.trim();
                if (!lectureContent) return alert("يرجى أدخال النص أولاً!");
            } else {
                const files = document.getElementById('fileInput').files;
                if (!files || files.length === 0) return alert("يرجى اختيار صور أو ملف PDF أولاً!");
                lectureContent = await extractTextFromFiles(apiKey, files);
            }

            logMessage("تحليل المحاضرة وصياغة هيكل السلايدات بواسطة AI...");
            updateProgress("جاري هندسة السلايدات وإعداد التصميم...", 60);

            const slidesJSON = await generateSlideStructure(apiKey, lectureContent);
            logMessage(`تم بناء ${slidesJSON.length} سلايد بنجاح!`);

            updateProgress("جاري إنشاء ملف الـ PowerPoint...", 85);
            await buildPowerPointFile(slidesJSON);

            updateProgress("اكتمل العمل بنجاح!", 100);
            logMessage("تم تنزيل ملف الـ PPTX بلمسات Termo الخاصة!");

        } catch (err) {
            logMessage(`❌ خطأ: ${err.message}`);
            alert(`حدث خطأ: ${err.message}`);
        }
    }

    async function extractTextFromFiles(apiKey, files) {
        let fullText = "";
        let pageQueue = [];

        for (let file of files) {
            if (file.type === "application/pdf") {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                for (let i = 1; i <= pdf.numPages; i++) pageQueue.push({ type: 'pdf_page', pdf, pageNum: i });
            } else if (file.type.startsWith("image/")) {
                pageQueue.push({ type: 'image_file', file });
            }
        }

        const total = pageQueue.length;
        for (let idx = 0; idx < total; idx++) {
            updateProgress(`قراءة واستخراج الصور صفحة (${idx + 1} من ${total})...`, Math.round((idx / total) * 50));
            const item = pageQueue[idx];
            let canvas;

            if (item.type === 'pdf_page') {
                const page = await item.pdf.getPage(item.pageNum);
                const viewport = page.getViewport({ scale: 1.5 });
                canvas = document.createElement('canvas');
                canvas.width = viewport.width; canvas.height = viewport.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            } else {
                canvas = await imageToCanvas(item.file);
            }

            const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
            logMessage(`استخراج النص من الصفحة ${idx + 1}...`);
            const pageText = await callGeminiOCR(apiKey, base64);
            fullText += pageText + "\n\n";
        }
        return fullText;
    }

    async function callGeminiOCR(apiKey, base64Image) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const promptText = `Extract all text cleanly from this image page. Preserve reading order (Arabic or English). Plain text only.`;

        const requestBody = {
            contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }]
        };

        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody) });
        const data = await res.json();
        return data.candidates[0].content.parts[0].text;
    }

    async function generateSlideStructure(apiKey, rawText) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const promptText = `You are a top-tier professor and presentation designer.
Analyze the following lecture content and transform it into a structured, highly engaging slide deck.

Return STRICTLY a JSON array of slide objects matching this format:
[
  {
    "title": "Main Title Of Lecture",
    "subtitle": "Subtitle or Key Theme",
    "type": "title_slide"
  },
  {
    "title": "Slide Concept Title",
    "subtitle": "Short Key Takeaway",
    "type": "content_slide",
    "points": [
      {"header": "Core Point 1", "desc": "Detailed explanation or breakdown of point 1."},
      {"header": "Core Point 2", "desc": "Detailed explanation or breakdown of point 2."}
    ]
  }
]

Lecture Raw Content:
${rawText.substring(0, 10000)}`;

        const requestBody = {
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: { response_mime_type: "application/json" }
        };

        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody) });
        const data = await res.json();
        return JSON.parse(data.candidates[0].content.parts[0].text);
    }

    async function buildPowerPointFile(slidesData) {
        let pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_16x9';

        // الألوان الأكاديمية الراقية
        const COLOR_BG = '0F172A';        # Dark Slate Navy
        const COLOR_CARD = '1E293B';      # Elevated Slate Card
        const COLOR_ACCENT = '0EA5E9';    # Electric Cyan
        const COLOR_TEXT = 'F8FAFC';      # White
        const COLOR_MUTED = '94A3B8';     # Muted Gray

        slidesData.forEach((slideInfo, idx) => {
            let slide = pptx.addSlide();
            
            // 1. خلفية داكنة فخمة
            slide.background = { color: COLOR_BG };

            // 2. توقيع وصنع Termo ثابت في كل السلايدات
            slide.addText('⚡ Created by Termo', {
                x: 9.5, y: 7.0, w: 3.5, h: 0.3,
                fontFace: 'Arial', fontSize: 11, bold: true,
                color: COLOR_ACCENT, align: 'right'
            });

            if (slideInfo.type === 'title_slide' || idx === 0) {
                // تصميم سلايد العنوان الرئيسي
                slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
                    x: 1.0, y: 1.5, w: 11.33, h: 4.5,
                    fill: { color: COLOR_CARD },
                    line: { color: COLOR_ACCENT, width: 2 }
                });

                slide.addText(slideInfo.title || 'محاضرة شاملة', {
                    x: 1.5, y: 2.2, w: 10.33, h: 1.5,
                    fontFace: 'Arial', fontSize: 36, bold: true,
                    color: COLOR_TEXT, align: 'center', isRtl: true
                });

                if (slideInfo.subtitle) {
                    slide.addText(slideInfo.subtitle, {
                        x: 1.5, y: 3.8, w: 10.33, h: 1.0,
                        fontFace: 'Arial', fontSize: 20,
                        color: COLOR_ACCENT, align: 'center', isRtl: true
                    });
                }
            } else {
                // تصميم سلايد المحتوى المتناسق
                slide.addText(slideInfo.title || `العنصر ${idx}`, {
                    x: 0.8, y: 0.5, w: 11.7, h: 0.8,
                    fontFace: 'Arial', fontSize: 26, bold: true,
                    color: COLOR_ACCENT, align: 'right', isRtl: true
                });

                if (slideInfo.subtitle) {
                    slide.addText(slideInfo.subtitle, {
                        x: 0.8, y: 1.2, w: 11.7, h: 0.5,
                        fontFace: 'Arial', fontSize: 14,
                        color: COLOR_MUTED, align: 'right', isRtl: true
                    });
                }

                // رسم الكروت المنظمة
                const points = slideInfo.points || [];
                const count = Math.min(points.length, 4);

                points.slice(0, 4).forEach((pt, pIdx) => {
                    let posX = 0.8;
                    let posY = 2.0;
                    let cardW = 11.7;
                    let cardH = 1.0;

                    if (count === 2) {
                        cardW = 5.6;
                        cardH = 4.5;
                        posX = 0.8 + (pIdx * 6.0);
                    } else if (count >= 3) {
                        cardW = 5.6;
                        cardH = 2.1;
                        const row = Math.floor(pIdx / 2);
                        const col = pIdx % 2;
                        posX = 0.8 + (col * 6.0);
                        posY = 2.0 + (row * 2.3);
                    }

                    // خلفية الكارت
                    slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
                        x: posX, y: posY, w: cardW, h: cardH,
                        fill: { color: COLOR_CARD },
                        line: { color: '334155', width: 1 }
                    });

                    // نص الكارت
                    slide.addText(pt.header || '', {
                        x: posX + 0.2, y: posY + 0.2, w: cardW - 0.4, h: 0.5,
                        fontFace: 'Arial', fontSize: 18, bold: true,
                        color: COLOR_TEXT, align: 'right', isRtl: true
                    });

                    if (pt.desc) {
                        slide.addText(pt.desc, {
                            x: posX + 0.2, y: posY + 0.7, w: cardW - 0.4, h: cardH - 0.8,
                            fontFace: 'Arial', fontSize: 13,
                            color: COLOR_MUTED, align: 'right', isRtl: true
                        });
                    }
                });
            }
        });

        await pptx.writeFile({ fileName: `Termo_Lecture_${Date.now()}.pptx` });
    }

    function imageToCanvas(file) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width; canvas.height = img.height;
                canvas.getContext('2d').drawImage(img, 0, 0);
                resolve(canvas);
            };
            img.src = URL.createObjectURL(file);
        });
    }

    function updateProgress(text, percent) {
        document.getElementById('progressText').innerText = text;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('progressBar').style.width = `${percent}%`;
    }
</script>
</body>
</html>
