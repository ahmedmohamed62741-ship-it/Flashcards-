<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo Luxury Slide Builder</title>
    
    <!-- PptxGenJS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <style>
        body { 
            background: radial-gradient(circle at top, #0f172a, #0b132b); 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif; 
            min-height: 100vh; 
            padding: 30px 15px; 
        }
        .main-card { 
            background: rgba(30, 41, 59, 0.9); 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); 
            padding: 30px; 
        }
        .section-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-control { 
            background-color: #1e293b; 
            border-color: #475569; 
            color: #f8fafc; 
            border-radius: 10px;
        }
        .form-control:focus { 
            background-color: #1e293b; 
            color: #fff; 
            border-color: #38bdf8; 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); 
        }
        .log-box { 
            background: #020617; 
            border-radius: 10px; 
            font-family: monospace; 
            font-size: 0.85rem; 
            max-height: 200px; 
            overflow-y: auto; 
            padding: 12px; 
            color: #38bdf8; 
            text-align: left; 
            direction: ltr; 
            border: 1px solid #1e293b;
        }
        .btn-luxury {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #fff;
            border: none;
            font-weight: bold;
            border-radius: 12px;
            padding: 14px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .btn-luxury:hover {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 800px;">
    <div class="main-card">
        
        <!-- Header -->
        <div class="text-center mb-4">
            <span class="badge bg-warning text-dark px-3 py-2 fw-bold rounded-pill mb-2">⚡ Termo Presentation Pro</span>
            <h2 class="fw-bold" style="color: #38bdf8;">👑 صانع العروض التقديمية الفخم</h2>
            <p class="text-slate-400 small mb-0">يمكنك نسخ النص مباشرة أو رفع الصور وسيتم التعرف عليها وإنشاء البوربوينت فورا</p>
        </div>

        <!-- API Key -->
        <div class="mb-4">
            <label class="form-label text-warning small fw-bold">🔑 Gemini API Key:</label>
            <input type="password" id="apiKeyInput" class="form-control" placeholder="أدخل مفتاح AIzaSy..." onchange="saveApiKey()">
        </div>

        <!-- Section 1: Direct Text Area (Always Visible) -->
        <div class="section-box">
            <h6 class="fw-bold text-info mb-2">✍️ الخيار الأول: نسخ / كتابة نص المحاضرة هنا مباشرةً</h6>
            <textarea id="rawTextInput" class="form-control" rows="5" placeholder="الصق أو اكتب نص المحاضرة هنا بالكامل..."></textarea>
        </div>

        <!-- Section 2: Image & File Upload -->
        <div class="section-box">
            <h6 class="fw-bold text-info mb-2">📸 الخيار الثاني: رفع صور المحاضرة أو المذكرات</h6>
            <input type="file" id="fileInput" accept="image/*" multiple class="form-control mb-2" onchange="showSelectedFiles(this.files)">
            <div id="fileListNotice" class="small text-warning"></div>
        </div>

        <!-- Submit Button -->
        <button id="processBtn" class="btn btn-luxury w-100 mb-3" onclick="startProcess()">
            🚀 إنتاج وتنزيل ملف البوربوينت الفخم (PPTX)
        </button>

        <!-- Progress Bar -->
        <div id="progressSection" style="display:none;" class="mb-3">
            <div class="d-flex justify-content-between small text-slate-300 mb-1">
                <span id="progressText">جاري المعالجة...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress" style="height: 10px; background-color: #0f172a;">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 0%"></div>
            </div>
        </div>

        <!-- Logs Box -->
        <div id="logBox" class="log-box" style="display:none;"></div>

    </div>
</div>

<script>
    // حفظ واسترجاع API Key
    window.onload = () => {
        const savedKey = localStorage.getItem('termo_gemini_key');
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    };

    function saveApiKey() {
        localStorage.setItem('termo_gemini_key', document.getElementById('apiKeyInput').value.trim());
    }

    function logMessage(msg, isError = false) {
        const logBox = document.getElementById('logBox');
        logBox.style.display = 'block';
        const color = isError ? '#f87171' : '#38bdf8';
        logBox.innerHTML += `<span style="color: ${color}">> ${msg}</span><br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateProgress(text, percent) {
        document.getElementById('progressSection').style.display = 'block';
        document.getElementById('progressText').innerText = text;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('progressBar').style.width = `${percent}%`;
    }

    function showSelectedFiles(files) {
        const notice = document.getElementById('fileListNotice');
        if (files && files.length > 0) {
            notice.innerText = `📁 تم اختيار ${files.length} صورة/ملف جاهز للرفع والتعرف الضوئي.`;
        } else {
            notice.innerText = '';
        }
    }

    // تحويل الملف إلى Base64 نقي
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    async function startProcess() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        if (!apiKey) return alert("يرجى أدخال Gemini API Key أولاً!");

        const pastedText = document.getElementById('rawTextInput').value.trim();
        const files = document.getElementById('fileInput').files;

        if (!pastedText && (!files || files.length === 0)) {
            return alert("يرجى وضع نص في المربع أو اختيار صورة على الأقل!");
        }

        document.getElementById('logBox').innerHTML = '';
        let fullCombinedText = pastedText ? `[النص المنسوخ]:\n${pastedText}\n\n` : '';

        try {
            // معالجة الصور إذا تم رفعها
            if (files && files.length > 0) {
                logMessage(`بدء معالجة (${files.length}) صورة للتعرف الضوئي...`);
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    updateProgress(`جاري قراءة ومعالجة الصورة ${i + 1} من ${files.length}...`, Math.round(((i + 1) / files.length) * 50));
                    logMessage(`قراءة الصورة: ${file.name}...`);
                    
                    const base64Data = await fileToBase64(file);
                    logMessage(`إرسال الصورة ${i + 1} إلى Gemini OCR للتعرف على النص...`);
                    const extractedText = await callGeminiVisionOCR(apiKey, base64Data, file.type || 'image/jpeg');
                    
                    if (extractedText) {
                        fullCombinedText += `\n--- محتوى الصورة (${file.name}) ---\n` + extractedText;
                        logMessage(`✅ تم التعرف على نص الصورة ${i + 1} بنجاح!`);
                    } else {
                        logMessage(`⚠️ لم يتم استخراج نص من الصورة ${i + 1}`, true);
                    }
                }
            }

            if (!fullCombinedText.trim()) {
                throw new Error("لم يتم العثور على أي نص معالج للبدء في إنشاء السلايدات.");
            }

            // تحليل المحتوى وهندسة السلايدات
            logMessage("جاري إرسال النص الكامل للذكاء الاصطناعي لبناء هيكل العرض التقديمي...");
            updateProgress("صياغة الشرائح والهيكل الأكاديمي...", 75);

            const slideData = await generatePresentationJSON(apiKey, fullCombinedText);
            logMessage(`✅ تم إنشاء هيكل لـ (${slideData.length}) شرائح بنجاح!`);

            // بناء ملف البوربوينت
            updateProgress("جاري تصميم ملف البوربوينت الفخم وتنسيقه...", 90);
            await createPptxFile(slideData);

            updateProgress("اكتملت العملية بنجاح!", 100);
            logMessage("🎉 تم تنزيل ملف البوربوينت الفخم بنجاح إلى جهازك!");

        } catch (err) {
            logMessage(`❌ خطأ: ${err.message}`, true);
            alert(`حدث خطأ: ${err.message}`);
        }
    }

    // التعرف على الصور عبر Gemini Vision
    async function callGeminiVisionOCR(apiKey, base64Data, mimeType) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        
        const payload = {
            contents: [{
                parts: [
                    { text: "Extract all text from this lecture image accurately. Keep both Arabic and English technical terms intact. Output plain text only." },
                    { inline_data: { mime_type: mimeType, data: base64Data } }
                ]
            }]
        };

        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            const errData = await res.json();
            throw new Error(`خطأ من سيرفر Gemini (${res.status}): ${errData.error?.message || 'فشل الاتصال'}`);
        }

        const data = await res.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
    }

    // إنشاء الهيكل الهندسي للبوربوينت (JSON)
    async function generatePresentationJSON(apiKey, fullText) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        
        const prompt = `You are an expert presentation designer.
Convert the following lecture content into a structured academic presentation array in strictly JSON format.

Return ONLY a JSON array, without markdown tags (\`\`\`json).

Schema:
[
  {
    "title": "Main Title",
    "subtitle": "Subtitle or Category",
    "type": "cover",
    "points": []
  },
  {
    "title": "Slide Title",
    "subtitle": "Slide Subtitle",
    "type": "content",
    "points": [
      {"header": "Point Title 1", "desc": "Clear explanation paragraph."},
      {"header": "Point Title 2", "desc": "Clear explanation paragraph."}
    ]
  }
]

Content:
${fullText.substring(0, 15000)}`;

        const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { response_mime_type: "application/json" }
        };

        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            const errData = await res.json();
            throw new Error(`خطأ أثناء إنشاء هيكل السلايدات: ${errData.error?.message || ''}`);
        }

        const data = await res.json();
        let rawStr = data.candidates[0].content.parts[0].text;
        
        // تنظيف مخرجات JSON
        rawStr = rawStr.replace(/```json/gi, '').replace(/```/g, '').trim();
        return JSON.parse(rawStr);
    }

    // بناء وتنسيق البوربوينت الفخم بواسطة PptxGenJS
    async function createPptxFile(slides) {
        let pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_16x9';

        const COLOR_BG = '0B132B';      // أزرق ملكي غامق
        const COLOR_CARD = '1C2541';    // كحلي فخم
        const COLOR_CYAN = '38BDF8';    // سماوي مضيء
        const COLOR_GOLD = 'FFD166';    // ذهبي ملكي
        const COLOR_TEXT = 'F8FAFC';    // أبيض ناصع
        const COLOR_MUTED = '94A3B8';   // رمادي هادئ

        slides.forEach((slideData, idx) => {
            let slide = pptx.addSlide();
            slide.background = { color: COLOR_BG };

            // العلامة المائية للغلاف والفوتر
            slide.addText('⚡ Termo Presentation Pro', {
                x: 0.5, y: 7.0, w: 4.0, h: 0.3,
                fontFace: 'Arial', fontSize: 10, bold: true,
                color: COLOR_CYAN, align: 'left'
            });

            slide.addText(`Slide ${idx + 1}`, {
                x: 11.5, y: 7.0, w: 1.2, h: 0.3,
                fontFace: 'Arial', fontSize: 10,
                color: COLOR_MUTED, align: 'right'
            });

            if (slideData.type === 'cover' || idx === 0) {
                // شريحة العنوان الرئيسي
                slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
                    x: 0.8, y: 1.2, w: 11.73, h: 5.0,
                    fill: { color: COLOR_CARD },
                    line: { color: COLOR_GOLD, width: 2 }
                });

                slide.addText(slideData.title || 'عرض تقديمي أكاديمي', {
                    x: 1.2, y: 2.2, w: 10.93, h: 1.5,
                    fontFace: 'Arial', fontSize: 36, bold: true,
                    color: COLOR_GOLD, align: 'center', isRtl: true
                });

                if (slideData.subtitle) {
                    slide.addText(slideData.subtitle, {
                        x: 1.2, y: 3.8, w: 10.93, h: 0.8,
                        fontFace: 'Arial', fontSize: 20,
                        color: COLOR_CYAN, align: 'center', isRtl: true
                    });
                }
            } else {
                // شرائح المحتوى
                slide.addText(slideData.title || `المحور ${idx}`, {
                    x: 0.8, y: 0.4, w: 11.73, h: 0.8,
                    fontFace: 'Arial', fontSize: 26, bold: true,
                    color: COLOR_CYAN, align: 'right', isRtl: true
                });

                if (slideData.subtitle) {
                    slide.addText(slideData.subtitle, {
                        x: 0.8, y: 1.1, w: 11.73, h: 0.4,
                        fontFace: 'Arial', fontSize: 14,
                        color: COLOR_GOLD, align: 'right', isRtl: true
                    });
                }

                const points = slideData.points || [];
                const count = Math.min(points.length, 4);

                points.slice(0, 4).forEach((pt, pIdx) => {
                    let posX = 0.8, posY = 1.8, cardW = 11.73, cardH = 1.1;

                    if (count === 2) {
                        cardW = 5.6; cardH = 4.8;
                        posX = 0.8 + (pIdx * 6.13);
                    } else if (count >= 3) {
                        cardW = 5.6; cardH = 2.2;
                        const row = Math.floor(pIdx / 2);
                        const col = pIdx % 2;
                        posX = 0.8 + (col * 6.13);
                        posY = 1.8 + (row * 2.5);
                    }

                    // كروت المحتوى المتناسقة
                    slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
                        x: posX, y: posY, w: cardW, h: cardH,
                        fill: { color: COLOR_CARD },
                        line: { color: pIdx === 0 ? COLOR_GOLD : '334155', width: 1.5 }
                    });

                    slide.addText(pt.header || '', {
                        x: posX + 0.2, y: posY + 0.2, w: cardW - 0.4, h: 0.4,
                        fontFace: 'Arial', fontSize: 16, bold: true,
                        color: COLOR_TEXT, align: 'right', isRtl: true
                    });

                    if (pt.desc) {
                        slide.addText(pt.desc, {
                            x: posX + 0.2, y: posY + 0.65, w: cardW - 0.4, h: cardH - 0.75,
                            fontFace: 'Arial', fontSize: 12,
                            color: COLOR_MUTED, align: 'right', isRtl: true
                        });
                    }
                });
            }
        });

        await pptx.writeFile({ fileName: `Termo_Presentation_${Date.now()}.pptx` });
    }
</script>
</body>
    </html>
