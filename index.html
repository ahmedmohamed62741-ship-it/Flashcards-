<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo Luxury Slide Builder</title>
    
    <!-- PDF.js & PptxGenJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <style>
        body { 
            background: radial-gradient(circle at top, #1c2541, #0b132b); 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif; 
            min-height: 100vh; 
            padding: 25px 0; 
        }
        .main-card { 
            background: rgba(28, 37, 65, 0.85); 
            border: 1px solid rgba(72, 202, 228, 0.2); 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(12px);
            padding: 35px; 
        }
        .drop-zone { 
            border: 2px dashed #48cae4; 
            border-radius: 16px; 
            background: rgba(72, 202, 228, 0.03); 
            padding: 30px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: block;
        }
        .drop-zone:hover { 
            background: rgba(72, 202, 228, 0.08); 
            border-color: #ffd166;
        }
        .form-control, .form-select { 
            background-color: #0b132b; 
            border-color: #1c2541; 
            color: #f8fafc; 
            border-radius: 10px;
        }
        .form-control:focus { 
            background-color: #0b132b; 
            color: #fff; 
            border-color: #48cae4; 
            box-shadow: 0 0 10px rgba(72, 202, 228, 0.3); 
        }
        .log-box { 
            background: #050a18; 
            border-radius: 12px; 
            font-family: 'Courier New', monospace; 
            font-size: 0.85rem; 
            max-height: 180px; 
            overflow-y: auto; 
            padding: 12px; 
            color: #48cae4; 
            text-align: left; 
            direction: ltr; 
            border: 1px solid #1c2541;
        }
        .btn-luxury {
            background: linear-gradient(135deg, #48cae4, #0077b6);
            color: #fff;
            border: none;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .btn-luxury:hover {
            background: linear-gradient(135deg, #0077b6, #48cae4);
            box-shadow: 0 0 15px rgba(72, 202, 228, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 760px;">
    <div class="main-card text-center">
        <div class="mb-3">
            <span class="badge bg-warning text-dark px-3 py-2 fw-bold rounded-pill">⚡ Termo AI Engine 2.5 Pro</span>
        </div>
        <h2 class="fw-bold mb-2" style="color: #48cae4;">👑 Termo Presentation Generator</h2>
        <p class="text-slate-400 small mb-4">تحويل الصور، المستندات، والنصوص الأكاديمية إلى شرائح PowerPoint فخمة</p>

        <!-- API Key Input -->
        <div class="mb-3 text-start">
            <label class="form-label text-slate-300 small fw-bold">Gemini API Key:</label>
            <input type="password" id="apiKeyInput" class="form-control form-control-sm" placeholder="AIzaSy..." onchange="saveApiKey()">
        </div>

        <!-- Mode Selection -->
        <div class="btn-group w-100 mb-3" role="group">
            <input type="radio" class="btn-check" name="inputType" id="typeFile" checked onclick="toggleInputMode('file')">
            <label class="btn btn-outline-info py-2" for="typeFile">📸 رفع صور أو ملفات PDF</label>

            <input type="radio" class="btn-check" name="inputType" id="typeText" onclick="toggleInputMode('text')">
            <label class="btn btn-outline-info py-2" for="typeText">✍️ نسخ / كتابة نص المحاضرة</label>
        </div>

        <!-- File Upload Area (Label Linked Directly) -->
        <div id="fileUploadContainer" class="mb-3">
            <label for="fileInput" id="dropZone" class="drop-zone">
                <div style="font-size: 2.5rem;" class="mb-2">📚</div>
                <h6 class="fw-bold text-white mb-1">اضغط هنا لاختيار الصور أو ملفات الـ PDF</h6>
                <p class="text-slate-400 small mb-0">أو اسحب الملفات وأسقطها داخل هذا المربع</p>
                <div id="fileSelectedLabel" class="mt-2 text-start"></div>
            </label>
            <input type="file" id="fileInput" accept="image/*,application/pdf" multiple style="display:none;" onchange="updateFileLabel(this.files)">
        </div>

        <!-- Text Input Area -->
        <div id="textInputContainer" class="mb-3 text-start" style="display:none;">
            <label class="form-label text-slate-300 small fw-bold">نص المحاضرة:</label>
            <textarea id="rawTextInput" class="form-control" rows="7" placeholder="ضع نص المحاضرة هنا بالكامل..."></textarea>
        </div>

        <!-- Action Button -->
        <button id="processBtn" class="btn btn-luxury w-100 py-3 mb-3 fs-6" onclick="startBuildingPresentation()">
            👑 إنتاج ملف البوربوينت الفخم وتحميله الآن
        </button>

        <!-- Progress Indicator -->
        <div id="progressSection" style="display:none;" class="mb-3">
            <div class="d-flex justify-content-between small text-slate-300 mb-1">
                <span id="progressText">جاري المعالجة...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress" style="height: 10px; border-radius: 5px; background-color: #0b132b;">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 0%"></div>
            </div>
        </div>

        <!-- System Logs -->
        <div id="logBox" class="log-box mb-2" style="display:none;"></div>
    </div>
</div>

<script>
    // حل مشكلة CORS لتشغيل الـ PDF Worker بشكل مضمون داخل الذاكرة
    async function initPdfWorker() {
        try {
            const response = await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
            const workerCode = await response.text();
            const blob = new Blob([workerCode], { type: 'text/javascript' });
            pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
        } catch (e) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    }
    initPdfWorker();

    window.onload = () => {
        const savedKey = localStorage.getItem('termo_gemini_key');
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;

        // إعداد السحب والإفلات Drag and Drop
        const dropZone = document.getElementById('dropZone');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        dropZone.addEventListener('drop', e => {
            const dt = e.dataTransfer;
            if (dt.files && dt.files.length > 0) {
                document.getElementById('fileInput').files = dt.files;
                updateFileLabel(dt.files);
            }
        });
    };

    function saveApiKey() {
        localStorage.setItem('termo_gemini_key', document.getElementById('apiKeyInput').value.trim());
    }

    function toggleInputMode(mode) {
        document.getElementById('fileUploadContainer').style.display = mode === 'file' ? 'block' : 'none';
        document.getElementById('textInputContainer').style.display = mode === 'text' ? 'block' : 'none';
    }

    function updateFileLabel(files) {
        const labelBox = document.getElementById('fileSelectedLabel');
        if (!files || files.length === 0) {
            labelBox.innerHTML = '';
            return;
        }
        let html = `<div class="p-2 bg-dark rounded border border-info small text-white mt-2">`;
        html += `<strong class="text-info d-block mb-1">📁 تم تحديد ${files.length} ملف/ملفات:</strong><ul class="mb-0 ps-3">`;
        for (let i = 0; i < Math.min(files.length, 4); i++) {
            const sizeMB = (files[i].size / (1024 * 1024)).toFixed(2);
            html += `<li>${files[i].name} <span class="text-warning">(${sizeMB} MB)</span></li>`;
        }
        if (files.length > 4) html += `<li>...وغيرها (${files.length - 4} ملفات أخرى)</li>`;
        html += `</ul></div>`;
        labelBox.innerHTML = html;
    }

    function logMessage(msg) {
        const logBox = document.getElementById('logBox');
        logBox.style.display = 'block';
        logBox.innerHTML += `> ${msg}<br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function resizeAndCompressImage(imageElement, maxDimension = 1200, quality = 0.75) {
        const canvas = document.createElement('canvas');
        let width = imageElement.width;
        let height = imageElement.height;

        if (width > height) {
            if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
            }
        } else {
            if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
            }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imageElement, 0, 0, width, height);
        return canvas.toDataURL('image/jpeg', quality).split(',')[1];
    }

    async function startBuildingPresentation() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        if (!apiKey) return alert("يرجى إدخال مفتاح Gemini API أولاً!");

        const isTextMode = document.getElementById('typeText').checked;
        let lectureContent = "";

        document.getElementById('progressSection').style.display = 'block';
        document.getElementById('logBox').innerHTML = '';

        try {
            if (isTextMode) {
                lectureContent = document.getElementById('rawTextInput').value.trim();
                if (!lectureContent) return alert("يرجى إدخال النص أولاً!");
            } else {
                const files = document.getElementById('fileInput').files;
                if (!files || files.length === 0) return alert("يرجى اختيار صور أو ملفات PDF أولاً!");
                lectureContent = await processAndExtractFiles(apiKey, files);
            }

            logMessage("جاري تحليل النص وهندسة السلايدات بواسطة AI...");
            updateProgress("صياغة العروض والهيكل الأكاديمي...", 70);

            const slidesJSON = await generateSlideStructure(apiKey, lectureContent);
            logMessage(`تم بناء هيكل لـ (${slidesJSON.length}) سلايد بنجاح!`);

            updateProgress("جاري بناء وتصميم ملف PowerPoint الفخم...", 90);
            await buildLuxuriousPowerPoint(slidesJSON);

            updateProgress("اكتمل العمل والتحميل بنجاح!", 100);
            logMessage("✨ تم إنشاء وتنزيل الملف بتنسيقات Termo الفخمة!");

        } catch (err) {
            logMessage(`❌ خطأ: ${err.message}`);
            alert(`حدث خطأ أثناء العمل: ${err.message}`);
        }
    }

    async function processAndExtractFiles(apiKey, files) {
        let extractedTextCombined = "";
        let pageQueue = [];

        for (let file of files) {
            if (file.type === "application/pdf") {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                for (let i = 1; i <= pdf.numPages; i++) pageQueue.push({ type: 'pdf_page', pdf, pageNum: i });
            } else if (file.type.startsWith("image/")) {
                pageQueue.push({ type: 'image_file', file });
            }
        }

        const totalPages = pageQueue.length;
        logMessage(`إجمالي عدد الصفحات للضغط والقراءة: ${totalPages}`);

        for (let idx = 0; idx < totalPages; idx++) {
            updateProgress(`معالجة وضغط الصفحة (${idx + 1} من ${totalPages})...`, Math.round((idx / totalPages) * 60));
            const item = pageQueue[idx];
            let base64Data = "";

            if (item.type === 'pdf_page') {
                const page = await item.pdf.getPage(item.pageNum);
                const viewport = page.getViewport({ scale: 1.2 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width; canvas.height = viewport.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                base64Data = canvas.toDataURL('image/jpeg', 0.75).split(',')[1];
            } else {
                base64Data = await processImageFileToBase64(item.file);
            }

            logMessage(`استخراج النص الذكي للصفحة ${idx + 1}...`);
            const pageText = await callGeminiOCR(apiKey, base64Data);
            extractedTextCombined += `\n--- Page ${idx + 1} ---\n` + pageText;
        }

        return extractedTextCombined;
    }

    function processImageFileToBase64(file) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const compressedBase64 = resizeAndCompressImage(img, 1200, 0.75);
                resolve(compressedBase64);
            };
            img.src = URL.createObjectURL(file);
        });
    }

    async function callGeminiOCR(apiKey, base64Image) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const promptText = `Extract all text cleanly from this lecture page. Preserve Arabic & English technical terminology accurately. Plain text only.`;

        const requestBody = {
            contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }]
        };

        try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody) });
            const data = await res.json();
            return data.candidates[0].content.parts[0].text;
        } catch (e) {
            return "";
        }
    }

    async function generateSlideStructure(apiKey, text) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const promptText = `You are a world-class professor and senior presentation designer.
Transform the following lecture content into an organized, high-impact slide deck structure.

Return STRICTLY valid JSON array of slide objects. No markdown markers (like \`\`\`json), no pre-text or post-text.
Format Schema:
[
  {
    "title": "Slide Title",
    "subtitle": "Subtitle or Context",
    "type": "cover", 
    "points": []
  },
  {
    "title": "Concept or Topic Title",
    "subtitle": "Brief Category or Takeaway",
    "type": "content",
    "points": [
      {"header": "Key Point 1", "desc": "Detailed clear explanation in bullet form."},
      {"header": "Key Point 2", "desc": "Detailed clear explanation in bullet form."}
    ]
  }
]

Lecture Content:
${text.substring(0, 12000)}`;

        const requestBody = {
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: { response_mime_type: "application/json" }
        };

        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody) });
        const data = await res.json();
        let rawJsonStr = data.candidates[0].content.parts[0].text;

        rawJsonStr = rawJsonStr.replace(/```json/g, "").replace(/```/g, "").trim();
        return JSON.parse(rawJsonStr);
    }

    async function buildLuxuriousPowerPoint(slidesData) {
        let pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_16x9';

        const COLOR_BG = '0B132B';
        const COLOR_CARD = '1C2541';
        const COLOR_CYAN = '48CAE4';
        const COLOR_GOLD = 'FFD166';
        const COLOR_TEXT = 'F8FAFC';
        const COLOR_MUTED = '94A3B8';

        slidesData.forEach((slideInfo, idx) => {
            let slide = pptx.addSlide();
            slide.background = { color: COLOR_BG };

            slide.addText('⚡ Termo Academic Deck', {
                x: 0.6, y: 7.0, w: 4.0, h: 0.3,
                fontFace: 'Arial', fontSize: 10, bold: true,
                color: COLOR_CYAN, align: 'left'
            });

            slide.addText(`Slide ${idx + 1}`, {
                x: 11.5, y: 7.0, w: 1.2, h: 0.3,
                fontFace: 'Arial', fontSize: 10,
                color: COLOR_MUTED, align: 'right'
            });

            if (slideInfo.type === 'cover' || idx === 0) {
                slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
                    x: 0.8, y: 1.2, w: 11.73, h: 5.0,
                    fill: { color: COLOR_CARD },
                    line: { color: COLOR_GOLD, width: 2 }
                });

                slide.addText(slideInfo.title || 'محاضرة أكاديمية شاملة', {
                    x: 1.2, y: 2.0, w: 10.93, h: 1.6,
                    fontFace: 'Arial', fontSize: 36, bold: true,
                    color: COLOR_GOLD, align: 'center', isRtl: true
                });

                if (slideInfo.subtitle) {
                    slide.addText(slideInfo.subtitle, {
                        x: 1.2, y: 3.7, w: 10.93, h: 0.8,
                        fontFace: 'Arial', fontSize: 20,
                        color: COLOR_CYAN, align: 'center', isRtl: true
                    });
                }

                slide.addText('Presented by: Termo AI Engine', {
                    x: 1.2, y: 5.0, w: 10.93, h: 0.5,
                    fontFace: 'Arial', fontSize: 14, italic: true,
                    color: COLOR_MUTED, align: 'center'
                });

            } else {
                slide.addText(slideInfo.title || `المحور ${idx}`, {
                    x: 0.8, y: 0.4, w: 11.73, h: 0.8,
                    fontFace: 'Arial', fontSize: 26, bold: true,
                    color: COLOR_CYAN, align: 'right', isRtl: true
                });

                if (slideInfo.subtitle) {
                    slide.addText(slideInfo.subtitle, {
                        x: 0.8, y: 1.1, w: 11.73, h: 0.4,
                        fontFace: 'Arial', fontSize: 14,
                        color: COLOR_GOLD, align: 'right', isRtl: true
                    });
                }

                const points = slideInfo.points || [];
                const count = Math.min(points.length, 4);

                points.slice(0, 4).forEach((pt, pIdx) => {
                    let posX = 0.8;
                    let posY = 1.8;
                    let cardW = 11.73;
                    let cardH = 1.1;

                    if (count === 2) {
                        cardW = 5.6;
                        cardH = 4.8;
                        posX = 0.8 + (pIdx * 6.13);
                    } else if (count >= 3) {
                        cardW = 5.6;
                        cardH = 2.2;
                        const row = Math.floor(pIdx / 2);
                        const col = pIdx % 2;
                        posX = 0.8 + (col * 6.13);
                        posY = 1.8 + (row * 2.5);
                    }

                    slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
                        x: posX, y: posY, w: cardW, h: cardH,
                        fill: { color: COLOR_CARD },
                        line: { color: pIdx === 0 ? COLOR_GOLD : '334155', width: 1.5 }
                    });

                    slide.addText(pt.h
