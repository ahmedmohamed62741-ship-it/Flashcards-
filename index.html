<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo Presentation Builder Pro 3.7 Ultra</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <style>
        body { 
            background: radial-gradient(circle at top, #0f172a, #0b132b); 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif; 
            min-height: 100vh; 
            padding: 25px 12px; 
        }
        .main-card { 
            background: rgba(30, 41, 59, 0.95); 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); 
            padding: 25px 18px; 
        }
        .section-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
        }
        .form-control { 
            background-color: #1e293b; 
            border-color: #475569; 
            color: #f8fafc; 
            border-radius: 10px;
        }
        .form-control:focus { 
            background-color: #1e293b; 
            color: #fff; 
            border-color: #38bdf8; 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); 
        }
        .log-box { 
            background: #020617; 
            border-radius: 10px; 
            font-family: monospace; 
            font-size: 0.85rem; 
            max-height: 250px; 
            overflow-y: auto; 
            padding: 12px; 
            color: #38bdf8; 
            text-align: right; 
            direction: rtl; 
            border: 1px solid #1e293b;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .btn-luxury {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #fff;
            border: none;
            font-weight: bold;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.15rem;
            transition: all 0.3s ease;
            cursor: pointer;
            width: 100%;
        }
        .btn-luxury:active {
            transform: scale(0.98);
        }
        .btn-luxury:disabled {
            background: #334155 !important;
            color: #94a3b8 !important;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 800px;">
    <div class="main-card">
        
        <!-- Header -->
        <div class="text-center mb-4">
            <span class="badge bg-warning text-dark px-3 py-2 fw-bold rounded-pill mb-2">⚡ Termo Presentation Pro 3.7 Ultra</span>
            <h2 class="fw-bold" style="color: #38bdf8;">👑 صانع العروض التقديمية الأكاديمي</h2>
            <p class="text-slate-400 small mb-0">سرعة خارقة - رفع مباشر لملفات الـ PDF والصور دون تهنيج الموبايل</p>
        </div>

        <!-- API Key -->
        <div class="mb-4">
            <label class="form-label text-warning small fw-bold">🔑 Gemini API Key:</label>
            <input type="password" id="apiKeyInput" class="form-control" placeholder="أدخل مفتاح AIzaSy..." onchange="saveApiKey()">
        </div>

        <!-- Section 1: Text -->
        <div class="section-box">
            <h6 class="fw-bold text-info mb-2">✍️ 1. نسخ / كتابة نص المحاضرة (اختياري):</h6>
            <textarea id="rawTextInput" class="form-control" rows="3" placeholder="الصق أي نص إضافي هنا إن وجد..."></textarea>
        </div>

        <!-- Section 2: Files -->
        <div class="section-box">
            <h6 class="fw-bold text-info mb-2">📂 2. رفع ملفات المحاضرة (PDF / صور روشتات ومستندات / TXT):</h6>
            <input type="file" id="fileInput" accept="image/*,application/pdf,.txt" multiple class="form-control mb-2" onchange="showSelectedFiles(this.files)">
            <div id="fileListNotice" class="small text-warning fw-bold"></div>
        </div>

        <!-- Submit Button -->
        <button id="processBtn" class="btn-luxury mb-3">
            🚀 إنتاج وتنزيل ملف البوربوينت الفخم (PPTX)
        </button>

        <!-- Progress Bar -->
        <div id="progressSection" style="display:none;" class="mb-3">
            <div class="d-flex justify-content-between small text-slate-300 mb-1">
                <span id="progressText">جاري المعالجة...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress" style="height: 12px; background-color: #0f172a; border-radius: 6px;">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 0%"></div>
            </div>
        </div>

        <!-- Logs Box -->
        <div id="logBox" class="log-box" style="display:none;"></div>

    </div>
</div>

<script>
    const GEMINI_MODELS = [
        'gemini-2.5-flash',
        'gemini-1.5-flash',
        'gemini-2.0-flash'
    ];

    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('termo_gemini_key');
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;

        const btn = document.getElementById('processBtn');
        if (btn) {
            btn.addEventListener('click', startProcess);
        }
    });

    function saveApiKey() {
        const val = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('termo_gemini_key', val);
    }

    function logMessage(msg, isError = false) {
        const logBox = document.getElementById('logBox');
        logBox.style.display = 'block';
        const color = isError ? '#f87171' : '#38bdf8';
        const time = new Date().toLocaleTimeString('ar-EG');
        logBox.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateProgress(text, percent) {
        document.getElementById('progressSection').style.display = 'block';
        document.getElementById('progressText').innerText = text;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('progressBar').style.width = `${percent}%`;
    }

    function showSelectedFiles(files) {
        const notice = document.getElementById('fileListNotice');
        if (files && files.length > 0) {
            let names = Array.from(files).map(f => f.name).join(', ');
            notice.innerText = `📁 تم اختيار (${files.length}) ملف: ${names}`;
        } else {
            notice.innerText = '';
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                const base64 = reader.result.split(',')[1];
                resolve(base64);
            };
            reader.onerror = () => reject(new Error("فشل قراءة الملف من الجهاز"));
            reader.readAsDataURL(file);
        });
    }

    function readTextFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error("فشل قراءة الملف النصي"));
            reader.readAsText(file);
        });
    }

    async function ensurePptxGenLoaded() {
        if (window.PptxGenJS) return true;
        logMessage("⏳ جاري جلب مكتبة إنشاء البوربوينت...");
        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = "https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js";
            s.onload = () => {
                logMessage("✅ تم تحميل مكتبة البوربوينت بنجاح!");
                resolve(true);
            };
            s.onerror = () => reject(new Error("تعذر تحميل مكتبة PptxGenJS. يرجى التأكد من الاتصال بالإنترنت."));
            document.head.appendChild(s);
        });
    }

    async function callGeminiApiWithFallback(apiKey, partsPayload) {
        let lastError = null;

        for (const model of GEMINI_MODELS) {
            logMessage(`🤖 جاري الاتصال بالنموذج الذكي (${model})...`);
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            
            const bodyData = {
                contents: [{ parts: partsPayload }],
                generationConfig: {
                    response_mime_type: "application/json"
                }
            };

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                if (res.ok) {
                    const data = await res.json();
                    const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (resultText) return resultText;
                } else {
                    const errData = await res.json().catch(() => ({}));
                    const errMsg = errData.error?.message || `Status ${res.status}`;
                    logMessage(`⚠️ النموذج ${model} أعاد خطأ: ${errMsg}`);
                    lastError = new Error(errMsg);
                }
            } catch (err) {
                logMessage(`⚠️ تعذر الاتصال بـ ${model}: ${err.message}`);
                lastError = err;
            }
        }
        throw lastError || new Error("فشلت جميع محاولات الاتصال بالذكاء الاصطناعي.");
    }

    async function startProcess() {
        const btn = document.getElementById('processBtn');
        
        try {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert("يرجى إدخال مفتاح Gemini API Key أولاً!");
                return;
            }

            const pastedText = document.getElementById('rawTextInput').value.trim();
            const files = document.getElementById('fileInput').files;

            if (!pastedText && (!files || files.length === 0)) {
                alert("يرجى اختيار ملف (PDF/صورة) أو كتابة نص المحاضرة للبدء!");
                return;
            }

            // الاستجابة الفورية للمستخدم
            btn.disabled = true;
            btn.innerText = "⏳ جاري المعالجة... يرجى الانتظار";
            document.getElementById('logBox').innerHTML = '';
            
            logMessage("🚀 بدء عملية الإنتاج بنجاح...");
            updateProgress("جاري تجهيز الملفات والمدخلات...", 15);

            const partsPayload = [];

            const systemPrompt = `You are an expert presentation designer and university professor.
Analyze all provided files (PDFs, images, or text) and extract the key academic concepts.
Create a structured presentation array in strictly JSON format.

Return ONLY a valid JSON array matching this exact structure, without markdown backticks:
[
  {
    "title": "Main Lecture Title",
    "subtitle": "Subject / Overview",
    "type": "cover",
    "points": []
  },
  {
    "title": "Slide Title",
    "subtitle": "Section Subtitle",
    "type": "content",
    "points": [
      {"header": "Point Title 1", "desc": "Clear detailed description and explanation."},
      {"header": "Point Title 2", "desc": "Clear detailed description and explanation."}
    ]
  }
]`;

            partsPayload.push({ text: systemPrompt });

            if (pastedText) {
                partsPayload.push({ text: `[نص المحاضرة المكتوب]:\n${pastedText}` });
            }

            if (files && files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    logMessage(`📂 قراءة الملف (${i + 1} من ${files.length}): ${file.name}...`);

                    if (file.size > 19 * 1024 * 1024) {
                        throw new Error(`الملف ${file.name} حجمه كبير جداً (أكبر من 19MB).`);
                    }

                    if (file.type === "application/pdf" || file.name.endsWith('.pdf')) {
                        logMessage(`📄 جاري تجهيز ملف الـ PDF المباشر (${file.name})...`);
                        const base64Data = await fileToBase64(file);
                        partsPayload.push({
                            inline_data: {
                                mime_type: "application/pdf",
                                data: base64Data
                            }
                        });
                        logMessage(`✅ تم إرفاق ملف PDF بنجاح (${(file.size / (1024*1024)).toFixed(2)} MB)`);
                    } 
                    else if (file.type.startsWith("image/")) {
                        logMessage(`🖼️ جاري تجهيز الصورة (${file.name})...`);
                        const base64Data = await fileToBase64(file);
                        partsPayload.push({
                            inline_data: {
                                mime_type: file.type || "image/jpeg",
                                data: base64Data
                            }
                        });
                        logMessage(`✅ تم إرفاق الصورة بنجاح`);
                    } 
                    else {
                        logMessage(`📝 جاري قراءة الملف النصي (${file.name})...`);
                        const txtContent = await readTextFile(file);
                        partsPayload.push({ text: `[محتوى ملف ${file.name}]:\n${txtContent}` });
                    }
                }
            }

            updateProgress("جاري تحليل المحتوى وتوليد الشرائح عبر الذكاء الاصطناعي...", 50);
            logMessage("🧠 إرسال البيانات للذكاء الاصطناعي لاستخراج الشرائح...");

            const rawJsonStr = await callGeminiApiWithFallback(apiKey, partsPayload);
            logMessage("✨ تم استلام الرد من الذكاء الاصطناعي بنجاح!");

            const cleanedStr = rawJsonStr.replace(/```json/gi, '').replace(/```/g, '').trim();
            const slideData = JSON.parse(cleanedStr);

            logMessage(`📊 تم تكوين هيكل العرض التقديمي (${slideData.length} شرائح).`);
            updateProgress("جاري إعداد وتنسيق ملف البوربوينت...", 85);

            await ensurePptxGenLoaded();
            await createPptxFile(slideData);

            updateProgress("اكتملت العملية بنجاح! 100%", 100);
            logMessage("🎉 تم تنزيل ملف البوربوينت (PPTX) بنجاح إلى جهازك!");

        } catch (err) {
            logMessage(`❌ خطأ: ${err.message}`, true);
            alert(`حدث خطأ: ${err.message}`);
        } finally {
            btn.disabled = false;
            btn.innerText = "🚀 إنتاج وتنزيل ملف البوربوينت الفخم (PPTX)";
        }
    }

    async function createPptxFile(slides) {
        let pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_16x9';

        const COLOR_BG = '0B132B';
        const COLOR_CARD = '1C2541';
        const COLOR_CYAN = '38BDF8';
        const COLOR_GOLD = 'FFD166';
        const COLOR_TEXT = 'F8FAFC';
        const COLOR_MUTED = '94A3B8';

        slides.forEach((slideData, idx) => {
            let slide = pptx.addSlide();
            slide.background = { color: COLOR_BG };

            slide.addText('⚡ Termo Presentation Pro', {
                x: 0.5, y: 7.0, w: 4.0, h: 0.3,
                fontFace: 'Arial', fontSize: 10, bold: true,
                color: COLOR_CYAN, align: 'left'
            });

            slide.addText(`Slide ${idx + 1}`, {
                x: 11.5, y: 7.0, w: 1.2, h: 0.3,
                fontFace: 'Arial', fontSize: 10,
                color: COLOR_MUTED, align: 'right'
            });

            if (slideData.type === 'cover' || idx === 0) {
                slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
                    x: 0.8, y: 1.2, w: 11.73, h: 5.0,
                    fill: { color: COLOR_CARD },
                    line: { color: COLOR_GOLD, width: 2 }
                });

                slide.addText(slideData.title || 'عرض تقديمي أكاديمي', {
                    x: 1.2, y: 2.2, w: 10.93, h: 1.5,
                    fontFace: 'Arial', fontSize: 36, bold: true,
                    color: COLOR_GOLD, align: 'center', isRtl: true
                });

                if (slideData.subtitle) {
                    slide.addText(slideData.subtitle, {
                        x: 1.2, y: 3.8, w: 10.93, h: 0.8,
                        fontFace: 'Arial', fontSize: 20,
                        color: COLOR_CYAN, align: 'center', isRtl: true
                    });
                }
            } else {
                slide.addText(slideData.title || `المحور ${idx}`, {
                    x: 0.8, y: 0.4, w: 11.73, h: 0.8,
                    fontFace: 'Arial', fontSize: 26, bold: true,
                    color: COLOR_CYAN, align: 'right', isRtl: true
                });

                if (slideData.subtitle) {
                    slide.addText(slideData.subtitle, {
                        x: 0.8, y: 1.1, w: 11.73, h: 0.4,
                        fontFace: 'Arial', fontSize: 14,
                        color: COLOR_GOLD, align: 'right', isRtl: true
                    });
                }

                const points = slideData.points || [];
                const count = Math.min(points.length, 4);

                points.slice(0, 4).forEach((pt, pIdx) => {
                    let posX = 0.8, posY = 1.8, cardW = 11.73, cardH = 1.1;

                    if (count === 2) {
                        cardW = 5.6; cardH = 4.8;
                        posX = 0.8 + (pIdx * 6.13);
                    } else if (count >= 3) {
                        cardW = 5.6; cardH = 2.2;
                        const row = Math.floor(pIdx / 2);
                        const col = pIdx % 2;
                        posX = 0.8 + (col * 6.13);
                        posY = 1.8 + (row * 2.5);
                    }

                    slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
                        x: posX, y: posY, w: cardW, h: cardH,
                        fill: { color: COLOR_CARD },
                        line: { color: pIdx === 0 ? COLOR_GOLD : '334155', width: 1.5 }
                    });

                    slide.addText(pt.header || '', {
                        x: posX + 0.2, y: posY + 0.2, w: cardW - 0.4, h: 0.4,
                        fontFace: 'Arial', fontSize: 16, bold: true,
                        color: COLOR_TEXT, align: 'right', isRtl: true
                    });

                    if (pt.desc) {
                        slide.addText(pt.desc, {
                            x: posX + 0.2, y: posY + 0.65, w: cardW - 0.4, h: cardH - 0.75,
                            fontFace: 'Arial', fontSize: 12,
                            color: COLOR_MUTED, align: 'right', isRtl: true
                        });
                    }
                });
            }
        });

        await pptx.writeFile({ fileName: `Termo_Presentation_${Date.now()}.pptx` });
    }
</script>
</body>
</html>
