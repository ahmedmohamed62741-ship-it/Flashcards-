<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo Presentation Builder Pro</title>
    
    <!-- PDF.js & PptxGenJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <style>
        body { 
            background: radial-gradient(circle at top, #0f172a, #0b132b); 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif; 
            min-height: 100vh; 
            padding: 30px 15px; 
        }
        .main-card { 
            background: rgba(30, 41, 59, 0.9); 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); 
            padding: 30px; 
        }
        .section-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-control { 
            background-color: #1e293b; 
            border-color: #475569; 
            color: #f8fafc; 
            border-radius: 10px;
        }
        .form-control:focus { 
            background-color: #1e293b; 
            color: #fff; 
            border-color: #38bdf8; 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); 
        }
        .log-box { 
            background: #020617; 
            border-radius: 10px; 
            font-family: monospace; 
            font-size: 0.85rem; 
            max-height: 220px; 
            overflow-y: auto; 
            padding: 12px; 
            color: #38bdf8; 
            text-align: left; 
            direction: ltr; 
            border: 1px solid #1e293b;
        }
        .btn-luxury {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #fff;
            border: none;
            font-weight: bold;
            border-radius: 12px;
            padding: 14px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .btn-luxury:hover {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            color: #fff;
        }
        .btn-luxury:disabled {
            background: #334155;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 820px;">
    <div class="main-card">
        
        <!-- Header -->
        <div class="text-center mb-4">
            <span class="badge bg-warning text-dark px-3 py-2 fw-bold rounded-pill mb-2">⚡ Termo Presentation Pro 3.6</span>
            <h2 class="fw-bold" style="color: #38bdf8;">👑 صانع العروض التقديمية الأكاديمي</h2>
            <p class="text-slate-400 small mb-0">يدعم النص المباشر + الصور / الروشتات + ملفات الـ PDF والملفات النصية الكبيرة</p>
        </div>

        <!-- API Key -->
        <div class="mb-4">
            <label class="form-label text-warning small fw-bold">🔑 Gemini API Key:</label>
            <input type="password" id="apiKeyInput" class="form-control" placeholder="أدخل مفتاح AIzaSy..." onchange="saveApiKey()">
        </div>

        <!-- Section 1: Direct Text Area -->
        <div class="section-box">
            <h6 class="fw-bold text-info mb-2">✍️ 1. نسخ / كتابة نص المحاضرة المباشر:</h6>
            <textarea id="rawTextInput" class="form-control" rows="4" placeholder="الصق نص المحاضرة هنا إن وجد..."></textarea>
        </div>

        <!-- Section 2: PDF, Images & Lecture Files Upload -->
        <div class="section-box">
            <h6 class="fw-bold text-info mb-2">📂 2. رفع ملفات المحاضرة (PDF كبيرة / صور روشتات ومستندات / TXT):</h6>
            <input type="file" id="fileInput" accept="image/*,application/pdf,.txt" multiple class="form-control mb-2" onchange="showSelectedFiles(this.files)">
            <div id="fileListNotice" class="small text-warning"></div>
        </div>

        <!-- Submit Button -->
        <button id="processBtn" class="btn btn-luxury w-100 mb-3" onclick="startProcess()">
            🚀 إنتاج وتنزيل ملف البوربوينت الفخم (PPTX)
        </button>

        <!-- Progress Bar -->
        <div id="progressSection" style="display:none;" class="mb-3">
            <div class="d-flex justify-content-between small text-slate-300 mb-1">
                <span id="progressText">جاري المعالجة...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress" style="height: 10px; background-color: #0f172a;">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 0%"></div>
            </div>
        </div>

        <!-- Logs Box -->
        <div id="logBox" class="log-box" style="display:none;"></div>

    </div>
</div>

<script>
    // ضبط مكتبة قراءة PDF
    if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // قائمة النماذج المتاحة للذكاء الاصطناعي مع التبديل التلقائي
    const GEMINI_MODELS = [
        'gemini-3.6-flash',
        'gemini-2.5-flash',
        'gemini-1.5-flash',
        'gemini-2.0-flash'
    ];

    window.onload = () => {
        const savedKey = localStorage.getItem('termo_gemini_key');
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    };

    function saveApiKey() {
        localStorage.setItem('termo_gemini_key', document.getElementById('apiKeyInput').value.trim());
    }

    function logMessage(msg, isError = false) {
        const logBox = document.getElementById('logBox');
        logBox.style.display = 'block';
        const color = isError ? '#f87171' : '#38bdf8';
        logBox.innerHTML += `<span style="color: ${color}">> ${msg}</span><br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateProgress(text, percent) {
        document.getElementById('progressSection').style.display = 'block';
        document.getElementById('progressText').innerText = text;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('progressBar').style.width = `${percent}%`;
    }

    function showSelectedFiles(files) {
        const notice = document.getElementById('fileListNotice');
        if (files && files.length > 0) {
            notice.innerText = `📁 تم اختيار (${files.length}) ملف/صورة جاهزة للمعالجة.`;
        } else {
            notice.innerText = '';
        }
    }

    // ضغط الصور لمنع الـ Memory Overflow
    function compressImageFile(file, maxDimension = 1200, quality = 0.75) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDimension) {
                            height = Math.round((height * maxDimension) / width);
                            width = maxDimension;
                        }
                    } else {
                        if (height > maxDimension) {
                            width = Math.round((width * maxDimension) / height);
                            height = maxDimension;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function readTextFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsText(file);
        });
    }

    // محرك طلبات Gemini مع التبديل التلقائي عند توقف أي نموذج
    async function callGeminiApiWithFallback(apiKey, partsPayload, isJson = false) {
        let lastError = null;

        for (const model of GEMINI_MODELS) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const bodyData = { contents: [{ parts: partsPayload }] };
            if (isJson) {
                bodyData.generationConfig = { response_mime_type: "application/json" };
            }

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                if (res.ok) {
                    const data = await res.json();
                    const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (resultText) return resultText;
                } else {
                    const errData = await res.json().catch(() => ({}));
                    const errMsg = errData.error?.message || res.statusText;
                    
                    if (res.status === 404 || errMsg.includes('no longer available') || errMsg.includes('not found')) {
                        logMessage(`⚠️ النموذج ${model} غير متاح، جاري تجربة النموذج التالي...`);
                        lastError = new Error(errMsg);
                        continue;
                    } else {
                        throw new Error(`خطأ Gemini (${res.status}): ${errMsg}`);
                    }
                }
            } catch (err) {
                lastError = err;
                if (err.message.includes('not available') || err.message.includes('404')) continue;
                throw err;
            }
        }
        throw lastError || new Error("تعذر الاتصال بجميع نماذج Gemini المتاحة.");
    }

    async function processPdfFile(file, apiKey) {
        if (!window.pdfjsLib) throw new Error("مكتبة قراءة الـ PDF لم تكتمل في التحميل، تحقق من الإنترنت.");
        logMessage(`جاري فتح وتحليل ملف الـ PDF: (${file.name})...`);
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let pdfCombinedText = "";

        for (let i = 1; i <= pdf.numPages; i++) {
            logMessage(`معالجة صفحة PDF رقم ${i} من ${pdf.numPages}...`);
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const extractedStr = textContent.items.map(item => item.str).join(" ");

            if (extractedStr.trim().length > 40) {
                pdfCombinedText += `\n[PDF Page ${i}]:\n` + extractedStr;
            } else {
                logMessage(`الصفحة ${i} مصورة/سكانر، جاري استخراج النص منها بـ AI OCR...`);
                const viewport = page.getViewport({ scale: 1.2 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                const base64 = canvas.toDataURL('image/jpeg', 0.75).split(',')[1];
                
                const parts = [
                    { text: "Extract all text cleanly from this image, preserving medical and technical terms in Arabic & English perfectly." },
                    { inline_data: { mime_type: 'image/jpeg', data: base64 } }
                ];
                const ocrText = await callGeminiApiWithFallback(apiKey, parts, false);
                pdfCombinedText += `\n[PDF Page ${i} (OCR)]:\n` + ocrText;
            }
        }
        return pdfCombinedText;
    }

    async function startProcess() {
        const btn = document.getElementById('processBtn');
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        
        if (!apiKey) return alert("يرجى إدخال مفتاح Gemini API Key أولاً!");

        const pastedText = document.getElementById('rawTextInput').value.trim();
        const files = document.getElementById('fileInput').files;

        if (!pastedText && (!files || files.length === 0)) {
            return alert("يرجى وضع نص أو اختيار صور/ملفات للبدء!");
        }

        // تعطيل الزر وتحديث الحالة بأسلوب بصري واضح
        btn.disabled = true;
        btn.innerText = "⏳ جاري المعالجة والتحليل...";
        document.getElementById('logBox').innerHTML = '';
        
        let fullCombinedText = pastedText ? `[النص المباشر]:\n${pastedText}\n\n` : '';

        try {
            if (files && files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    updateProgress(`جاري معالجة الملف (${i + 1} من ${files.length}): ${file.name}`, Math.round(((i + 1) / files.length) * 60));

                    if (file.type === "application/pdf" || file.name.endsWith('.pdf')) {
                        const pdfText = await processPdfFile(file, apiKey);
                        fullCombinedText += pdfText;
                    } else if (file.type.startsWith("image/")) {
                        logMessage(`قراءة وضغط صورة المستند/الروشتة: ${file.name}...`);
                        const base64Data = await compressImageFile(file, 1200, 0.75);
                        
                        logMessage(`استخراج البيانات الطبية والأكاديمية من الصورة...`);
                        const parts = [
                            { text: "Extract all text from this lecture or prescription image accurately. Keep both Arabic and English terms intact." },
                            { inline_data: { mime_type: 'image/jpeg', data: base64Data } }
                        ];
                        const extractedText = await callGeminiApiWithFallback(apiKey, parts, false);
                        fullCombinedText += `\n[نص الصورة ${file.name}]:\n` + extractedText;
                    } else if (file.type.startsWith("text/") || file.name.endsWith('.txt')) {
                        logMessage(`قراءة الملف النصي: ${file.name}...`);
                        const txtContent = await readTextFile(file);
                        fullCombinedText += `\n[محتوى الملف ${file.name}]:\n` + txtContent;
                    }
                }
            }

            if (!fullCombinedText.trim()) {
                throw new Error("لم يتم العثور على أي نص معالج للبدء في إنتاج السلايدات.");
            }

            logMessage("جاري صياغة الشرائح والهيكل الأكاديمي بواسطة AI...");
            updateProgress("هندسة وتنسيق العرض التقديمي...", 80);

            const slideData = await generatePresentationJSON(apiKey, fullCombinedText);
            logMessage(`✅ تم بناء هيكل لـ (${slideData.length}) شرائح بنجاح!`);

            updateProgress("جاري إنشاء ملف البوربوينت وتنزيله...", 95);
            await createPptxFile(slideData);

            updateProgress("اكتملت العملية بنجاح!", 100);
            logMessage("🎉 تم تنزيل ملف PowerPoint الفخم بنجاح إلى جهازك!");

        } catch (err) {
            logMessage(`❌ خطأ: ${err.message}`, true);
            alert(`حدث خطأ أثناء العمل: ${err.message}`);
        } finally {
            // إعادة تفعيل الزر دائماً بعد الانتهاء
            btn.disabled = false;
            btn.innerText = "🚀 إنتاج وتنزيل ملف البوربوينت الفخم (PPTX)";
        }
    }

    async function generatePresentationJSON(apiKey, fullText) {
        const prompt = `You are an expert presentation designer and professor.
Convert the following lecture content into a structured academic presentation array in strictly JSON format.

Return ONLY a JSON array, without markdown tags (\`\`\`json).

Schema:
[
  {
    "title": "Main Title",
    "subtitle": "Subtitle or Category",
    "type": "cover",
    "points": []
  },
  {
    "title": "Slide Title",
    "subtitle": "Slide Subtitle",
    "type": "content",
    "points": [
      {"header": "Point Title 1", "desc": "Clear explanation paragraph."},
      {"header": "Point Title 2", "desc": "Clear explanation paragraph."}
    ]
  }
]

Content:
${fullText.substring(0, 16000)}`;

        const parts = [{ text: prompt }];
        const rawJsonStr = await callGeminiApiWithFallback(apiKey, parts, true);
        const cleanedStr = rawJsonStr.replace(/```json/gi, '').replace(/```/g, '').trim();
        return JSON.parse(cleanedStr);
    }

    async function createPptxFile(slides) {
        if (!window.PptxGenJS) throw new Error("مكتبة إنشاء البوربوينت لم تكتمل في التحميل.");
        let pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_16x9';

        const COLOR_BG = '0B132B';
        const COLOR_CARD = '1C2541';
        const COLOR_CYAN = '38BDF8';
        const COLOR_GOLD = 'FFD166';
        const COLOR_TEXT = 'F8FAFC';
        const COLOR_MUTED = '94A3B8';

        slides.forEach((slideData, idx) => {
            let slide = pptx.addSlide();
            slide.background = { color: COLOR_BG };

            slide.addText('⚡ Termo Presentation Pro', {
                x: 0.5, y: 7.0, w: 4.0, h: 0.3,
                fontFace: 'Arial', fontSize: 10, bold: true,
                color: COLOR_CYAN, align: 'left'
            });

            slide.addText(`Slide ${idx + 1}`, {
                x: 11.5, y: 7.0, w: 1.2, h: 0.3,
                fontFace: 'Arial', fontSize: 10,
                color: COLOR_MUTED, align: 'right'
            });

            if (slideData.type === 'cover' || idx === 0) {
                slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
                    x: 0.8, y: 1.2, w: 11.73, h: 5.0,
                    fill: { color: COLOR_CARD },
                    line: { color: COLOR_GOLD, width: 2 }
                });

                slide.addText(slideData.title || 'عرض تقديمي أكاديمي', {
                    x: 1.2, y: 2.2, w: 10.93, h: 1.5,
                    fontFace: 'Arial', fontSize: 36, bold: true,
                    color: COLOR_GOLD, align: 'center', isRtl: true
                });

                if (slideData.subtitle) {
                    slide.addText(slideData.subtitle, {
                        x: 1.2, y: 3.8, w: 10.93, h: 0.8,
                        fontFace: 'Arial', fontSize: 20,
                        color: COLOR_CYAN, align: 'center', isRtl: true
                    });
                }
            } else {
                slide.addText(slideData.title || `المحور ${idx}`, {
                    x: 0.8, y: 0.4, w: 11.73, h: 0.8,
                    fontFace: 'Arial', fontSize: 26, bold: true,
                    color: COLOR_CYAN, align: 'right', isRtl: true
                });

                if (slideData.subtitle) {
                    slide.addText(slideData.subtitle, {
                        x: 0.8, y: 1.1, w: 11.73, h: 0.4,
                        fontFace: 'Arial', fontSize: 14,
                        color: COLOR_GOLD, align: 'right', isRtl: true
                    });
                }

                const points = slideData.points || [];
                const count = Math.min(points.length, 4);

                points.slice(0, 4).forEach((pt, pIdx) => {
                    let posX = 0.8, posY = 1.8, cardW = 11.73, c
