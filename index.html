<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ الروشتات الذكي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .container { max-width: 600px; background: white; padding: 20px; margin: auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 15px 0; width: 100%; padding: 10px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; text-align: right; background: #e9ecef; padding: 15px; border-radius: 5px; white-space: pre-wrap; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h2>فحص الروشتة والأدوية</h2>
        <input type="file" id="imageInput" accept="image/*"><br>
        <button onclick="analyzeImage()">قراءة وفحص عالي الدقة</button>
        <div id="result">النتيجة ستظهر هنا...</div>
    </div>

    <script>
        // ضع مفتاح الـ API الخاص بـ Google AI Studio هنا بين القوسين
        const apiKey = "ضع_مفتاح_الـ_API_هنا";

        async function analyzeImage() {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');

            if (fileInput.files.length === 0) {
                alert("من فضلك اختر صورة الروشتة أولاً!");
                return;
            }

            const file = fileInput.files[0];
            resultDiv.innerText = "جاري قراءة الروشتة وفحص الحروف بدقة صيدلانية...";

            try {
                const base64Data = await convertToBase64(file);
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "أنت صيدلي خبير. اقرأ خط الدكتور في هذه الروشتة بدقة فائقة، وطلع أسماء الأدوية، التركيزات، والجرعات المطلوبة بشكل منظّم وواضح." },
                                {
                                    inline_data: {
                                        mime_type: file.type,
                                        data: base64Data
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message || "حدث خطأ من السيرفر");
                }

                const text = data.candidates[0].content.parts[0].text;
                resultDiv.innerText = text;

            } catch (error) {
                resultDiv.innerText = "حدث خطأ: " + error.message;
            }
        }

        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
